[project]
name = "ronin-ai"
version = "0.1.0"
description = "AI-driven mobile (Android and iOS) end-to-end testing agent"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["testing", "e2e", "mobile", "android", "ios", "appium", "llm", "agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Testing",
]
dependencies = [
    "appium-python-client>=5.0.0",
    # The excluded releases are the compromised PyPI uploads from the
    # March and October 2026 supply chain attacks, not bad builds.
    "litellm>=1.0.0,!=1.82.7,!=1.82.8,!=1.107.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "imagehash>=4.3.1",
]

[project.optional-dependencies]
# Pulls torch (127MB on macOS arm64, 555MB on linux x86_64), so it is kept
# out of the base install and fetched on demand. See ronin.utils.vision_deps.
vision = [
    "ultralytics>=8.0.0",
    "easyocr>=1.6.0",
    "huggingface-hub>=0.16.0",
]
# The decision model is reached through its own SDK. See ronin.utils.jev_deps.
jev = [
    "typesafe-sdk>=0.7.5",
]

[project.scripts]
ronin = "ronin.cli.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ronin"]

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "pyright>=1.1.414",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff]
line-length = 100
# Vendored from the asd-ste100 skill, so its style is not ours to change. A
# fix here could not be landed upstream, and the next copy would undo it.
extend-exclude = ["tools/ste_lint.py"]

[tool.ruff.lint]
select = ["E", "F", "B", "SIM", "C90", "BLE", "W"]
# The formatter owns code width. The long lines that remain are prompt text and
# model-facing field descriptions, and nothing may rewrap them.
ignore = ["E501"]

[tool.ruff.lint.mccabe]
max-complexity = 21  # The project requirement is strictly less than 22.

# Recorded lint debt, read like tools/quality-baseline.toml: a ratchet.
# Remove an entry when the file is clean. Never add one to make a check pass.
#
# BLE001 is `except Exception`. These handlers still need narrowing.
[tool.ruff.lint.per-file-ignores]
"src/ronin/agent/device/control.py" = ["BLE001"]
"src/ronin/agent/device/session.py" = ["BLE001"]
"src/ronin/agent/run/agent.py" = ["BLE001"]
"src/ronin/agent/plan/planner.py" = ["SIM108"]
"src/ronin/agent/perception/detector.py" = ["B905"]
"src/ronin/agent/memory/replay.py" = ["BLE001"]
"src/ronin/agent/step/staleness.py" = ["BLE001"]
"src/ronin/agent/step/targeting.py" = ["BLE001"]
"src/ronin/agent/memory/trail.py" = ["BLE001"]
"src/ronin/app_discovery.py" = ["BLE001"]
"src/ronin/cli/devices.py" = ["B905"]
"src/ronin/llm/llm_client.py" = ["BLE001", "SIM105"]
"src/ronin/testing/cli.py" = ["BLE001"]
"src/ronin/testing/generator.py" = ["BLE001"]
"src/ronin/testing/qa_agent.py" = ["E402"]
"src/ronin/testing/qa_planner.py" = ["SIM108"]
"src/ronin/testing/runner.py" = ["BLE001"]

[tool.pyright]
include = ["src/ronin"]
pythonVersion = "3.12"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
# The test tree mirrors src/ronin, so a test file no longer sits beside
# fakes.py and pytest no longer puts tests/ on the path by itself.
pythonpath = ["tests"]

[tool.coverage.run]
branch = true
source = ["src/ronin"]

[tool.coverage.report]
show_missing = true
# The measured baseline for the offline suite. Raise it as coverage improves.
# It is a floor against regression, not a target.
fail_under = 46

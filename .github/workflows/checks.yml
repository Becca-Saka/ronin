name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # git diff --check below needs the merge base
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run ruff check
      # Catches what no lint rule does: a blank line added at end of file, and
      # a conflict marker. Empty on a push, since the merge base is HEAD.
      - run: git diff --check "$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD)"..HEAD
      - run: uv run python tools/quality_gate.py
      # Prompts, error messages and field descriptions are read by a model or
      # by a person under pressure. The linter is vendored beside the gate, so
      # this runs the same rules a local check runs.
      - run: uv run python tools/ste_gate.py
      # The schema editors read is generated from the models that validate a
      # ronin.yaml, so it cannot be left behind by a change to them.
      - run: uv run python tools/emit_schema.py --check
      - run: uv run coverage run -m pytest
      - run: uv run coverage report

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Pyright reads the perception module's deferred torch imports. The
      # Both optional extras must resolve here, although no job runs a model.
      - run: uv sync --group dev --extra vision --extra jev
      - run: uv run python tools/type_gate.py

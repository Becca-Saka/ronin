name: checks

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # git diff --check below needs the merge base
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - run: uv sync --group dev --extra jev
      - run: uv run ruff check
      # Catches a conflict marker and whitespace no lint rule covers.
      - run: git diff --check "$(git merge-base origin/${{ github.event.repository.default_branch }} HEAD)"..HEAD
      - run: uv run python tools/quality_gate.py
      - run: uv run python tools/ste_gate.py
      - run: uv run python tools/emit_schema.py --check
      - run: uv run coverage run -m pytest
      - run: uv run coverage report
      - run: uv run python -m tools.eval_gate
      - run: uv run python -m tools.mutation_sweep

  eval-screens:
    # Spends tokens, so it is opt-in: set the repository variable
    # RUN_SCREEN_EVAL to 'true' and add the key the model's provider needs.
    if: vars.RUN_SCREEN_EVAL == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv sync --group dev
      - run: uv run python -m tools.eval_gate --screens --record sweep/audits.json
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-sweep
          path: sweep/
          if-no-files-found: ignore

  types:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # Pyright reads the deferred torch and SDK imports, so both optional
      # extras must resolve here although no job runs a model.
      - run: uv sync --group dev --extra vision --extra jev
      - run: uv run python tools/type_gate.py

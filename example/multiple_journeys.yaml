id: food_delivery_suite
name: Food Delivery Test Suite
device:
  platform: android
  headless: false
  record: true
journeys:
  - id: food_delivery_happy_path
    name: End to End Food Delivery Order Happy Path
    journey: >
      A user opens the app and signs in.
      They type 'test@example.com' in the Email field, and type 'password123' in the Password field.
      Then, they click the Login button to sign in.
      They are taken to the location access screen and tap the 'Grant Location Permission' button.
      They are navigated to the home screen containing sorted restaurants.
      They tap the 'Menu' button on the 'Sweet Treats' restaurant card (which is card 0).
      On the menu screen, they tap the 'Add' button for the 'Chocolate Fudge Cake' item.
      Then, they tap the 'Cart' floating action button to view their cart.
      On the cart screen, they verify the subtotal and tap the 'Proceed to Checkout' button.
      On the payment selection screen, they select the 'Credit / Debit Card' radio option and tap the 'Continue' button.
      On the checkout screen, they type '123 Test Street, QA City' in the Address field.
      They type '4111222233334444' in the Card Number field and '123' in the CVV field.
      They tap the 'Place Order' button.
      They transition to the order status screen and verify the order status is CONFIRMING.
    security_rules:
      - "The logged-in user's credit card number must never be exposed or displayed in plain text on the checkout or order status screens."


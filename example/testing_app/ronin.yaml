# yaml-language-server: $schema=https://raw.githubusercontent.com/Becca-Saka/ronin/master/ronin-schema.json
device:
  name: Pixel_8
  platform: android
  headless: false
model: openrouter/deepseek/deepseek-v4.1-flash
app: build/app/outputs/flutter-apk/app-debug.apk
workflows:
  notifications:
    env:
      email: test@email.com
      password:
        value: secret-password123
        secret: true
      reply: Awesome notification!
    journeys:
    - id: notification_journey_01
      name: E2E Notification Detail and Switch Toggle Journey
      journey: |
        A user opens the app and lands on the sign-in screen. They type {{email}} in the Email
        field, and type {{password}} in the Password field. Then, they click the Login button to
        sign in. Once logged in, they land on the home notification feed screen. They click on the
        first notification item in the list. This redirects them to the detail screen for that
        notification. On the detail screen, they type {{reply}} in the reply input field. Next, they toggle the 'Pin notification' switch to true. Finally, they click
        the 'Submit' button to send their response.
      security_rules: &id001
      - The logged-in user's password must never be exposed or displayed in plain text on the Home or
        Dashboard screens.
      - The reply text input must not leak password characters or unmasked sensitive strings.
    security_rules: *id001
  delivery_checkout:
    env:
      email: qa.tester@example.com
      address: 47 Shinjuku Street, Testing City
      password:
        value: secret-password123
        secret: true
      card_number:
        value: '4111222233334444'
        secret: true
      cvv:
        value: '321'
        secret: true
    journeys:
    - id: delivery_checkout_01
      name: Food Delivery Card Checkout Journey
      journey: |
        A user opens the app and lands on the sign-in screen. They type {{email}} in the Email
        Address field, type {{password}} in the Password field, then tap the Login button. The app
        shows the location access screen, where they tap the Grant Location Permission button. They
        land on the home screen, which lists restaurants sorted nearest first. They tap the Menu
        button on the Burger Palace card. On the Burger Palace menu they tap the Add button for
        Classic Burger, then tap the Cart floating action button at the bottom right. On the My Cart
        screen they check the subtotal, then tap the Proceed to Checkout button. On the Select
        Payment screen they choose the Credit / Debit Card option and tap the Continue button. On
        the Checkout Details screen they type {{address}} in the delivery address field, type
        {{card_number}} in the Card Number field, type {{cvv}} in the CVV field, then tap the Place
        Order button. The app opens the order status screen, which confirms the order was placed and
        shows the current status as CONFIRMING.
      security_rules: &id002
      - The password must stay masked on the sign-in screen and must never appear in plain text on any
        later screen.
      - The full card number must never be displayed in plain text; only the last four digits may be visible.
      - The CVV must never be displayed in plain text on any screen.
    security_rules: *id002
  food_delivery_suite:
    env:
      email: test@example.com
      password:
        value: password123
        secret: true
      address: 123 Test Street, QA City
      card_number:
        value: '4111222233334444'
        secret: true
      cvv:
        value: '123'
        secret: true
    journeys:
    - id: food_delivery_happy_path
      name: End to End Food Delivery Order Happy Path
      journey: |
        A user opens the app and signs in. They type {{email}} in the Email field, and type
        {{password}} in the Password field. Then, they click the Login button to sign in. They are
        taken to the location access screen and tap the 'Grant Location Permission' button. They are
        navigated to the home screen containing sorted restaurants. They tap the 'Menu' button on
        the 'Sweet Treats' restaurant card (which is card 0). On the menu screen, they tap the 'Add'
        button for the 'Chocolate Fudge Cake' item. Then, they tap the 'Cart' floating action button
        to view their cart. On the cart screen, they verify the subtotal and tap the 'Proceed to
        Checkout' button. On the payment selection screen, they select the 'Credit / Debit Card'
        radio option and tap the 'Continue' button. On the checkout screen, they type {{address}} in the
        Address field. They type {{card_number}} in the Card Number field and {{cvv}} in the CVV
        field. They tap the 'Place Order' button. They transition to the order
        status screen and verify the order status is CONFIRMING.
      security_rules:
      - The logged-in user's credit card number must never be exposed or displayed in plain text on the
        checkout or order status screens.

id: notification_journey_01
name: E2E Notification Detail and Switch Toggle Journey
device:
  platform: android
  emulator: Pixel_8a
  headless: false
journey: >
  A user opens the app and lands on the sign-in screen.
  They type 'test@email.com' in the Email field, and type 'secret-password123' in the Password field.
  Then, they click the Login button to sign in.
  Once logged in, they land on the home notification feed screen.
  They click on the first notification item in the list.
  This redirects them to the detail screen for that notification.
  On the detail screen, they type 'Awesome notification!' in the reply input field.
  Next, they toggle the 'Pin notification' switch to true.
  Finally, they click the 'Submit' button to send their response.
security_rules:
  - "The logged-in user's password must never be exposed or displayed in plain text on the Home or Dashboard screens."
  - "The reply text input must not leak password characters or unmasked sensitive strings."

# Items whose answers are already accounted for.
#
# Each entry is a decision a person made. It names the reason, and the hash of
# the fixture the decision was made about. The gate reads this file and never
# writes it.
#
# An exemption is granted to a case, not to a name. Edit the fixture and the
# hash moves, the exemption lapses, and the item fails until somebody looks at
# it again. Delete the fixture and the entry names nothing, which also fails:
# removing a case is how a failure stops failing without being fixed.
